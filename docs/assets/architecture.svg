<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="title desc">
<title id="title">From human demonstrations to robot actions</title>
<desc id="desc">Two images and robot state enter a shared observation encoder. A BC branch predicts one action. A diffusion branch denoises ten actions and executes eight. Both receive fresh observations from the simulator.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1100" height="460" rx="18" fill="#f1f5f9"/>
<g font-family="Arial, sans-serif" fill="#0f172a">
<text x="32" y="39" font-size="22" font-weight="bold">Same observations. Two ways to choose an action.</text>
<text x="32" y="68" font-size="16" fill="#475569">Training signal: 200 human demonstrations · observation → demonstrated action</text>
<rect x="30" y="141" width="215" height="155" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="47" y="171" font-size="18" font-weight="bold">Current observation</text>
<text x="47" y="202" font-size="16">External + wrist images</text>
<text x="47" y="230" font-size="16">End-effector pose</text>
<text x="47" y="258" font-size="16">Gripper position</text>
<rect x="285" y="141" width="220" height="155" rx="12" fill="white" stroke="#cbd5e1"/>
<text x="302" y="171" font-size="18" font-weight="bold">Observation encoder</text>
<text x="302" y="202" font-size="16">ResNet18 image features</text>
<text x="302" y="230" font-size="16">+ robot-state features</text>
<text x="302" y="258" font-size="16">→ 256-d condition</text>
<rect x="550" y="108" width="270" height="105" rx="12" fill="#e2e8f0"/>
<text x="568" y="138" font-size="18" font-weight="bold">BC · direct regression</text>
<text x="568" y="166" font-size="16">DiT1d → one 7-d action</text>
<text x="568" y="192" font-size="16">Execute 1, then observe again</text>
<rect x="550" y="237" width="270" height="122" rx="12" fill="#dbeafe"/>
<text x="568" y="266" font-size="18" font-weight="bold">Diffusion · short plan</text>
<text x="568" y="294" font-size="16">Noise → 50 denoising steps</text>
<text x="568" y="320" font-size="16">10 actions; execute first 8</text>
<text x="568" y="344" font-size="14" fill="#475569">Training target: noise ε or clean x₀</text>
<rect x="865" y="170" width="205" height="111" rx="12" fill="#d1fae5"/>
<text x="883" y="202" font-size="18" font-weight="bold">Panda in simulation</text>
<text x="883" y="232" font-size="16">Square nut → peg</text>
<text x="883" y="258" font-size="16">Measure task success</text>
<text x="32" y="427" font-size="15" fill="#475569">Shared backbone architecture, independently learned weights. No physical robot deployment.</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M245 218 H280"/><path d="M505 185 H526 V160 H546"/><path d="M505 255 H526 V292 H546"/>
<path d="M820 160 H841 V204 H861"/><path d="M820 296 H841 V251 H861"/>
<path d="M967 282 V387 H136 V300"/>
</g>
<text x="415" y="379" font-family="Arial, sans-serif" font-size="15" fill="#475569">Fresh observations after execution</text>
</svg>
